name: Build RPK
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build projects
        run: |
          shopt -s nullglob
          for z in *.zip; do
            name="${z%.zip}"
            name="${name// /_}"
            mkdir -p "out/$name"
            unzip -o "$z" -d "out/$name"
            
            if [ -d "out/$name/Archive" ]; then
              mv out/$name/Archive/* out/$name/ 2>/dev/null || true
              mv out/$name/Archive/.* out/$name/ 2>/dev/null || true
            fi
            
            (cd "out/$name" && npm install && npx aiot build)
          done
      - name: Find and Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: |
            out/
          if-no-files-found: error
